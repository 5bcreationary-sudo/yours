project_id = "yours"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/*", "https://yours.fm/*"]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false

# Edge Functions. verify_jwt=false for functions that accept service-role
# (invoked by pg_cron) or signed-token visitors (public player).
[functions.generate-morning-briefing]
verify_jwt = false

[functions.get-briefing]
verify_jwt = false

[functions.issue-briefing-link]
verify_jwt = false

[functions.google-oauth-callback]
verify_jwt = true

[functions.trigger-briefing]
verify_jwt = false

[functions.send-sms]
verify_jwt = false
